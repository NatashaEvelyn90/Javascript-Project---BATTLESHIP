<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./CSS/style.css">
    <link rel="stylesheet" href="./CSS/bootstrap.min.css">
    <title>Battleship</title>
</head>
<body>
    <div>
        <img src="./MEDIA/U.S._Navy_guided-missile_frigate_FFG(X)_artist_rendering,_30_April_2020_(200430-N-NO101-150).jpeg" alt="Constellation class Frigate" class="backgroundImg">
    </div>
    <header>
        <h1>ARE YOU READY TO PLAY THE GAME?</h1>
        <button id="yesBtn" class="btn btn-success mx-2">YES</button>
        <button id="noBtn" class="btn btn-danger mx-2">NO</button>
        <p>The rules are simple, find the boat, you win!</p>
    </header>
    <main>
            <div class="battleGrid ">
                <div class="container">
                    <div class="row">                       
                            <div  class="clickSq col-2"></div>
                            <div  class="clickSq col-2"></div>                   
                            <div  class="clickSq col-2"></div>                      
                    </div>
            
                     <div class="row">                     
                            <div  class="clickSq col-2"></div>                     
                            <div  class="clickSq col-2"></div>                                           
                            <div  class="clickSq col-2"></div>                       
                    </div>
            
                     <div class="row">                    
                            <div  class="clickSq col-2"></div>                                          
                            <div  class="clickSq col-2"></div>                    
                            <div  class="clickSq col-2"></div>                       
                    </div>
                </div>
                <div id="gameResponse" class="gameResponse"></div>
                <div class="mt-2">
                    <button id="resetBtn" class="btn btn-primary">Start Over</button>
                </div>
    </main>
    <audio id="bgMusic" src="./MEDIA/KC_BS Ship to Ship Combat 150BPM FULLMIX.mp3" loop></audio>
    <script src="./JS/app.js"></script>
</body>
</html>
